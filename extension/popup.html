<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #0d0e11;
        color: #e9ebee;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #recdot { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; opacity: 0.2; transition: opacity .2s; }
      p.sub { margin: 0 0 14px; color: #8b919b; font-size: 11.5px; }
      label { display: block; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b919b; margin: 10px 0 4px; }
      input {
        width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 12.5px;
        background: #16181c; border: 1px solid #2a2e35; border-radius: 7px; color: #e9ebee; outline: none;
      }
      input:focus { border-color: #4a4f59; }
      .row { display: flex; gap: 8px; margin-top: 14px; }
      button {
        flex: 1; padding: 8px 10px; font-size: 12.5px; font-weight: 600; border-radius: 7px; cursor: pointer;
        border: 1px solid #2a2e35; background: #1b1e24; color: #e9ebee;
      }
      button.primary { background: #e9ebee; color: #0d0e11; border-color: #e9ebee; }
      button:disabled { opacity: 0.4; cursor: default; }
      #save { margin-top: 12px; width: 100%; }
      #status { margin-top: 12px; font-size: 11.5px; color: #8b919b; min-height: 16px; }
      a { color: #83a8f2; display: none; margin-top: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1><span id="recdot"></span> Aemulus Recorder</h1>
    <p class="sub">Record a task in this tab, then turn it into a skill on the site.</p>

    <label for="server">Aemulus URL</label>
    <input id="server" placeholder="https://your-app.up.railway.app" />
    <label for="key">API key</label>
    <input id="key" type="password" placeholder="aem_live_…  (from /developers)" />
    <button id="save">Save connection</button>

    <label for="title">Task name (optional)</label>
    <input id="title" placeholder="e.g. Add lead to CRM" />

    <div class="row">
      <button id="start" class="primary">Start recording</button>
      <button id="stop" disabled>Stop &amp; save</button>
    </div>

    <div id="status"></div>
    <a id="link" target="_blank">Open your recordings →</a>

    <script src="popup.js"></script>
  </body>
</html>
