[package]
name = "aemulus-registry"
version = "0.1.0"
description = "On-chain registry for Aemulus skills + verifiable run receipts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aemulus_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
