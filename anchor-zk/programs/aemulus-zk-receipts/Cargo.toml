[package]
name = "aemulus-zk-receipts"
version = "0.1.0"
description = "ZK-compressed on-chain run receipts for Aemulus (Light Protocol)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aemulus_zk_receipts"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1"
light-sdk = { version = "0.24.0", features = ["anchor", "cpi-context", "keccak"] }
light-hasher = "6.0.0"
